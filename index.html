<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SIH26250 | Air Power Decision Support</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a111d;--p:#101a2b;--p2:#15233a;--ln:#1e2d47;--tx:#d5dfef;--mu:#7b8aa3;--cy:#38bdf8;--ok:#34d399;--wn:#fbbf24;--bd:#f87171}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 'IBM Plex Sans',system-ui,sans-serif}
a{color:var(--cy);text-decoration:none}h1{font-size:20px;margin:0 0 14px;font-weight:600}h3{font-size:14px;margin:0 0 10px;font-weight:600}
.mono,td.m,.kpi b{font-family:'IBM Plex Mono',monospace}
.top{display:flex;align-items:center;gap:18px;padding:0 20px;height:54px;background:var(--p);border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:5}
.brand{font-weight:600;white-space:nowrap}.brand small{display:block;color:var(--mu);font-weight:400;font-size:11px;line-height:1}
.nav{display:flex;gap:2px;overflow-x:auto;flex:1}.nav a{color:var(--mu);padding:16px 11px;white-space:nowrap;border-bottom:2px solid transparent}.nav a.on{color:var(--tx);border-color:var(--cy)}
.rt{display:flex;gap:14px;align-items:center;white-space:nowrap;font-size:12px;color:var(--mu)}.live{color:var(--ok)}.live:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;animation:pl 2s infinite}
@keyframes pl{50%{opacity:.3}}
main{padding:20px;max-width:1400px;margin:auto}footer{padding:14px 20px;color:var(--mu);font-size:12px;border-top:1px solid var(--ln)}
.card{background:var(--p);border:1px solid var(--ln);border-radius:6px;padding:14px}.g2{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-top:14px}.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.kpi{background:var(--p);border:1px solid var(--ln);border-radius:6px;padding:12px}.kpi span{color:var(--mu);font-size:12px}.kpi b{display:block;font-size:24px;font-weight:500;margin-top:2px}
.btn{background:var(--p2);color:var(--tx);border:1px solid var(--ln);padding:8px 14px;border-radius:5px;font:inherit;cursor:pointer}.btn:hover{border-color:var(--cy)}.btn.pri{background:var(--cy);color:#06121f;border-color:var(--cy);font-weight:600}.btn.big{padding:12px 24px;font-size:15px}.btn:disabled{opacity:.5;cursor:wait}
.badge{padding:2px 8px;border-radius:10px;font-size:11px;border:1px solid}.Available,.ok{color:var(--ok)}.Standby,.cy{color:var(--cy)}.Maintenance,.wn{color:var(--wn)}.Unavailable,.bd{color:var(--bd)}
.badge.Available{background:#34d3991a}.badge.Standby{background:#38bdf81a}.badge.Maintenance{background:#fbbf241a}.badge.Unavailable{background:#f871711a}
table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--mu);font-weight:500;font-size:12px;padding:8px;border-bottom:1px solid var(--ln)}td{padding:8px;border-bottom:1px solid #16243b}
.alert{border:1px solid;border-radius:6px;padding:10px 14px;margin-bottom:14px;background:#fbbf2410}.alert a{margin-left:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.chip{padding:5px 12px;border-radius:14px;border:1px solid var(--ln);background:none;color:var(--mu);cursor:pointer;font:inherit}.chip.on{color:var(--cy);border-color:var(--cy)}
input,select{background:var(--bg);border:1px solid var(--ln);color:var(--tx);padding:8px 10px;border-radius:5px;font:inherit;width:100%}
.stp{padding:5px 0;color:var(--mu);display:flex;gap:10px;align-items:center}.stp:before{content:"";width:12px;height:12px;border:2px solid var(--cy);border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite}.stp.done{color:var(--tx)}.stp.done:before{animation:none;border:0;content:"\2713";color:var(--ok);width:auto;height:auto}
@keyframes sp{to{transform:rotate(360deg)}}
.cmp{background:var(--p);border:1px solid var(--ln);border-radius:6px;padding:12px}.cmp span{color:var(--mu);font-size:12px}.cmp div{font:500 20px 'IBM Plex Mono',monospace;margin-top:4px}.cmp i{color:var(--mu);font-style:normal;margin:0 6px}
.rec{border:1px solid var(--cy);background:linear-gradient(180deg,#38bdf810,transparent);border-radius:6px;padding:16px;margin-top:14px}.rec h3{color:var(--cy)}
details{margin:10px 0}summary{cursor:pointer;color:var(--cy)}ol{margin:8px 0;padding-left:20px}li{margin:3px 0}
.tag{display:inline-block;padding:1px 7px;border:1px solid var(--ln);border-radius:4px;font:12px 'IBM Plex Mono',monospace;margin:2px}
.ev{border-left:3px solid var(--wn);background:var(--p);padding:14px;border-radius:0 6px 6px 0;margin-top:14px}.ev.ok{border-color:var(--ok)}
.mod{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:20}.mod>div{background:var(--p);border:1px solid var(--ln);border-radius:8px;padding:18px;width:min(720px,94vw);max-height:80vh;overflow:auto}
.toast{position:fixed;right:18px;top:66px;background:var(--p2);border:1px solid var(--cy);padding:10px 14px;border-radius:5px;z-index:30;margin-bottom:8px}
.ch{width:100%;height:auto}.ax{fill:var(--mu);font:9px 'IBM Plex Mono',monospace}.leg{font-size:12px;color:var(--mu)}.leg i{display:inline-block;width:10px;height:10px;margin:0 4px 0 10px;border-radius:2px}
.pipe{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin-bottom:14px}.pipe span{border:1px solid var(--ln);padding:3px 8px;border-radius:4px}.pipe span:not(:last-child):after{content:"\203A";margin-left:8px;color:var(--cy)}
.node{background:var(--p);border:1px solid var(--ln);border-radius:6px;padding:10px 16px;width:min(420px,92%);text-align:center}.node small{display:block;color:var(--mu)}.arw{width:2px;height:26px;background:repeating-linear-gradient(var(--cy) 0 5px,transparent 5px 10px);background-size:2px 10px;animation:fl .8s linear infinite}@keyframes fl{to{background-position:0 10px}}
.flow{display:flex;flex-direction:column;align-items:center}.node.hl{border-color:var(--cy)}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center}.login form{width:min(380px,92vw)}.login label{display:block;margin:12px 0 4px;color:var(--mu);font-size:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}dt{color:var(--mu)}dd{margin:0}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr}.top{gap:10px;padding:0 10px}.rt span.h{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),sl=ms=>new Promise(r=>setTimeout(r,ms));let S={};
const R=s=>()=>(s=s*16807%2147483647)/2147483647;
const TY=['Lift-A','Lift-B','Rotary','Surveillance','Support'],CP={'Lift-A':['Lift-A','Lift-B'],'Lift-B':['Lift-B','Lift-A'],Rotary:['Rotary'],Surveillance:['Surveillance'],Support:['Support','Lift-A']},WX=['Rotary','Lift-B'],W={1:1,2:3,3:6},PN={1:'Low',2:'Medium',3:'High'};
const NM=['Supply Movement','Personnel Transfer','Area Survey','Relief Support','Sustainment Run','Medical Transfer','Route Survey','Equipment Lift','Liaison Transport'];
const usable=r=>(r.status=='Available'||r.status=='Standby')&&r.crew>0&&r.ready>=60,eff=r=>r.ready-(S.env.lv==1&&WX.includes(r.type)?15:0);
const ok=(t,r)=>usable(r)&&CP[t.type].includes(r.type)&&!(S.env.lv==2&&WX.includes(r.type))&&eff(r)>=55;
const byId=id=>S.res.find(r=>r.id==id);
function init(){const u=S.user,r=R(7);S={user:u,min:12,env:{lv:0},chg:[],log:[],recs:[],n:0,f:'All',q:'',sel:null,an:'7d',ev:null,pl:null,wi:null};
S.res=[...Array(42)].map((_,i)=>{const st=i%9==4?'Standby':i%10==7?'Maintenance':i%14==9?'Unavailable':'Available',rd=st=='Unavailable'?0:st=='Maintenance'?30+(r()*20|0):72+(r()*26|0);
return{id:'R-'+String(i+1).padStart(3,'0'),type:TY[i%5],status:st,ready:rd,crew:st=='Unavailable'?0:1+(i*7)%3,maint:st=='Maintenance'?'In service':rd<80?'Check due':'Cleared',upd:'06:00',x:(i%7)*1.6+.7+r()*.8,y:Math.floor(i/7)*1.1+.5+r()*.4}});
S.tasks=[...Array(18)].map((_,i)=>({id:'T-'+(101+i),name:NM[i%9]+' '+(1+(i/9|0)),type:TY[(i*3+i%2)%5],pr:[3,2,1,2,3,1,2][(i*5)%7]}));
const c={},p={};S.tasks.forEach(t=>{const l=S.res.filter(x=>x.type==t.type),k=c[t.type]=(c[t.type]||0)+1;p[t.id]=l[Math.floor((k-1)*2/3)].id});S.plan=p}
function ev(p,T=S.tasks){const used={},bad=[];let un=0,ws=0,wv=0,rd=0,vn=0;T.forEach(t=>{const w=W[t.pr];ws+=w;const r=byId(p[t.id]);if(!r){un++;bad.push(t.id);return}const d=used[r.id];used[r.id]=1;if(d||!ok(t,r))bad.push(t.id);else{wv+=w;rd+=eff(r);vn++}});
const cov=wv/ws,con=bad.length-un;return{conf:con,un,bad,cov,vn,util:Math.round(100*vn/Math.max(1,S.res.filter(usable).length)),score:Math.max(0,Math.round(100*(.75*cov+.25*(vn?rd/vn/100:0))-2*con))}}
function opt(T=S.tasks){const used=new Set(),p={};[...T].sort((a,b)=>b.pr-a.pr||a.id.localeCompare(b.id)).forEach(t=>{const c=S.res.filter(r=>!used.has(r.id)&&ok(t,r)).sort((a,b)=>(CP[t.type][0]==b.type)-(CP[t.type][0]==a.type)||eff(b)-eff(a));if(c[0]){p[t.id]=c[0].id;used.add(c[0].id)}});return p}
const clock=()=>{const d=new Date(Date.UTC(2026,9,4,6,0)+S.min*6e4);return d.toISOString().slice(11,16)},bd=s=>`<span class="badge ${s}">${s}</span>`;
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),3500)}
async function proc(id,st,ms=480){const e=$(id);e.innerHTML='';for(let i=0;i<st.length;i++){e.insertAdjacentHTML('beforeend',`<div class="stp" id="s${i}">${st[i]}</div>`);await sl(ms);$('#s'+i).classList.add('done')}}
function ch(ty,L,Z,mn=0,mx){mx=mx||Math.max(...Z.flatMap(s=>s.v))*1.15;const Wd=300,H=130,l=28,b=18,t=6,w=Wd-l-4,h=H-b-t,Y=v=>t+h-(v-mn)/(mx-mn)*h,n=L.length,X=i=>l+(ty=='bar'?(i+.5)*w/n:i*w/(n-1));let o=`<svg viewBox="0 0 ${Wd} ${H}" class="ch">`;
for(let k=0;k<=3;k++){const v=mn+(mx-mn)*k/3,y=Y(v);o+=`<line x1="${l}" x2="${Wd-4}" y1="${y}" y2="${y}" stroke="#1e2d47"/><text x="${l-4}" y="${y+3}" text-anchor="end" class="ax">${Math.round(v)}</text>`}
L.forEach((x,i)=>{if(n<9||i%2==0)o+=`<text x="${X(i)}" y="${H-5}" text-anchor="middle" class="ax">${x}</text>`});
Z.forEach((s,j)=>{const c=s.c||'#38bdf8';if(ty=='bar'){const bw=Math.min(22,w/n/(Z.length+.5));s.v.forEach((v,i)=>o+=`<rect x="${X(i)-bw*Z.length/2+j*bw}" y="${Y(v)}" width="${bw-2}" height="${Math.max(0,t+h-Y(v))}" fill="${c}" rx="1"/>`)}else o+=`<polyline fill="none" stroke="${c}" stroke-width="2" points="${s.v.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>`});
return o+'</svg>'+(Z.length>1?`<div class="leg">${Z.map(s=>`<i style="background:${s.c}"></i>${s.n}`).join('')}</div>`:'')}
const card=(t,b)=>`<div class="card"><h3>${t}</h3>${b}</div>`,cmp=(l,b,a)=>`<div class="cmp"><span>${l}</span><div>${b}<i>&rarr;</i><span class="ok" style="font:inherit">${a}</span></div></div>`;
function mkRec(np,b,a,T=S.tasks){const aff=[...new Set(T.filter(t=>np[t.id]!=S.plan[t.id]).flatMap(t=>[S.plan[t.id],np[t.id]]).filter(Boolean))],why=[];
S.chg.forEach(c=>why.push(c));if(!S.chg.length)why.push('Initial allocation ignored readiness, maintenance and crew status when assigning resources.');
if(b.conf)why.push(`${b.conf} assignment(s) conflict with current resource status, capability or environment limits.`);if(b.un)why.push(`${b.un} task(s) have no valid resource under the current plan.`);
why.push(`Existing allocation became less efficient: plan score ${b.score}% vs ${a.score}% achievable.`);
return{id:'REC-'+String(++S.n).padStart(3,'0'),aff,why,b,a,np,conf:Math.min(98,Math.round(72+26*a.cov)),st:'Pending',time:clock(),n:T.filter(t=>np[t.id]!=S.plan[t.id]).length}}
function recCard(r){const pend=r.st=='Pending';return `<div class="rec"><h3>AI recommendation ${r.id}</h3><p>Current conditions indicate that the existing plan requires adjustment. The optimization engine has generated an alternative feasible resource allocation.</p>
<div class="row" style="gap:24px"><div><span class="leg">Impact</span><br>${r.n} reassignment(s), ${r.b.conf+r.b.un} issue(s) resolved</div><div><span class="leg">Plan score</span><br><b class="mono">${r.b.score}% &rarr; ${r.a.score}%</b></div><div><span class="leg">Confidence</span><br><b class="mono">${r.conf}%</b></div><div><span class="leg">Status</span><br>${pend?'<span class="wn">Awaiting human approval</span>':`<span class="${r.st[0]=='A'?'ok':'bd'}">${r.st}</span>`}</div></div>
<details open><summary>Why?</summary><ol>${r.why.map(x=>`<li>${x}</li>`).join('')}</ol></details><div>Affected resources: ${r.aff.map(x=>`<span class="tag">${x}</span>`).join('')||'none'}</div>
<div class="row" style="margin-top:12px"><button class="btn" onclick="rev('${r.id}')">Review Plan</button>${pend?`<button class="btn pri" onclick="appr('${r.id}')">Approve Recommendation</button><button class="btn" onclick="rej('${r.id}')">Reject</button>`:''}</div>
<div class="leg" style="margin-top:8px">AI recommends only. Execution stays with the authorized human planner.</div></div>`}
function rev(id){const r=S.recs.find(x=>x.id==id),rows=S.tasks.filter(t=>r.np[t.id]!=S.plan[t.id]);document.body.insertAdjacentHTML('beforeend',`<div class="mod" onclick="if(event.target==this)this.remove()"><div><h3>Review plan ${r.id}</h3><table><tr><th>Task</th><th>Priority</th><th>Current</th><th>Proposed</th></tr>${rows.map(t=>`<tr><td class="m">${t.id} ${t.name}</td><td>${PN[t.pr]}</td><td class="m">${S.plan[t.id]||'none'}</td><td class="m ok">${r.np[t.id]||'unassigned'}</td></tr>`).join('')||'<tr><td colspan=4>No differences from the active plan.</td></tr>'}</table><p class="leg">${S.tasks.length-rows.length} assignment(s) unchanged.</p><button class="btn" onclick="this.closest('.mod').remove()">Close</button></div></div>`)}
function appr(id){if(S.user.role=='Resource Manager')return toast('Approval requires Operations Planner or Administrator role');const r=S.recs.find(x=>x.id==id);S.plan=r.np;r.st='Approved by '+S.user.id;S.chg=[];S.log.unshift(`${clock()} ${r.id} approved by ${S.user.id}; plan score ${r.a.score}%`);toast('Recommendation approved. Plan updated.');render()}
function rej(id){const r=S.recs.find(x=>x.id==id);r.st='Rejected by '+S.user.id;S.log.unshift(`${clock()} ${r.id} rejected by ${S.user.id}`);render()}
const ST={Available:'#34d399',Standby:'#38bdf8',Maintenance:'#fbbf24',Unavailable:'#f87171'};
function map(){const bad=new Set(ev(S.plan).bad.map(t=>S.plan[t]));return `<svg viewBox="0 0 12 7" style="width:100%;background:#0b1424;border-radius:4px">${[...Array(13)].map((_,i)=>`<line x1="${i}" x2="${i}" y1="0" y2="7" stroke="#16243b" stroke-width=".02"/>`).join('')}${[...Array(8)].map((_,i)=>`<line y1="${i}" y2="${i}" x1="0" x2="12" stroke="#16243b" stroke-width=".02"/>`).join('')}
${S.env.lv?`<rect x="6.2" y="0" width="5.8" height="3.4" fill="${S.env.lv>1?'#f87171':'#fbbf24'}" opacity=".12" stroke="${S.env.lv>1?'#f87171':'#fbbf24'}" stroke-width=".03" stroke-dasharray=".1"/><text x="6.35" y=".35" font-size=".28" fill="#7b8aa3">Sector C: ${S.env.lv>1?'high':'moderate'} constraint</text>`:''}
${S.res.map(r=>`<g onclick="S.sel='${r.id}';render()" style="cursor:pointer"><circle cx="${r.x}" cy="${r.y}" r="${S.sel==r.id?.28:.2}" fill="${ST[r.status]}" ${bad.has(r.id)?'stroke="#fff" stroke-width=".05"':''}/><text x="${r.x}" y="${r.y-.27}" font-size=".24" text-anchor="middle" fill="#7b8aa3">${r.id.slice(2)}</text></g>`).join('')}</svg>
<div class="leg">${Object.keys(ST).map(k=>`<i style="background:${ST[k]}"></i>${k}`).join('')}<i style="border:2px solid #fff;background:none"></i>Assignment affected</div>`}
function detail(){const r=byId(S.sel);if(!r)return card('Resource details','<p class="leg">Select a marker on the grid to inspect a resource.</p>');const t=S.tasks.find(t=>S.plan[t.id]==r.id);
return card('Resource '+r.id,`<dl><dt>Type</dt><dd>${r.type}</dd><dt>Status</dt><dd>${bd(r.status)}</dd><dt>Readiness</dt><dd class="mono">${eff(r)}%</dd><dt>Maintenance</dt><dd>${r.maint}</dd><dt>Crew</dt><dd>${r.crew}</dd><dt>Assigned task</dt><dd>${t?t.id+' '+t.name:'None'}</dd><dt>Availability</dt><dd>${usable(r)?'<span class="ok">Usable</span>':'<span class="bd">Not usable</span>'}</dd></dl>`)}
const P={
dashboard(){const e=ev(S.plan),us=S.res.filter(usable),rd=Math.round(us.reduce((a,r)=>a+eff(r),0)/Math.max(1,us.length)),k=[['Total Resources',S.res.length],['Available',us.length],['Crew Available',us.reduce((a,r)=>a+r.crew,0)],['Active Tasks',S.tasks.length],['Readiness',rd+'%'],['Plan Score',e.score+'%']];
return `<h1>Operations Dashboard</h1><div class="pipe">${['Live data','Data fusion','Current situation','AI analysis','Optimization','Recommendation','Human approval','Dynamic replanning'].map(x=>`<span>${x}</span>`).join('')}</div>
${e.bad.length?`<div class="alert wn"><b>Re-optimization recommended.</b> ${e.bad.length} assignment(s) in the active plan are affected.<a href="#planning">Open planning</a><a href="#events">Dynamic events</a></div>`:''}
<div class="kpis">${k.map(x=>`<div class="kpi"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div>
<div class="g2">${card('Operational overview (simulated grid)',map())}<div>${detail()}<div style="height:14px"></div>${card('Data fusion status',[['Resource system',S.res.length+' records'],['Crew system',S.res.length+' rosters'],['Maintenance system',S.res.filter(r=>r.status=='Maintenance').length+' open items'],['Environment system',['Normal','Moderate constraint','High constraint'][S.env.lv]],['Task priority system',S.tasks.length+' tasks']].map(x=>`<div class="row" style="justify-content:space-between;padding:3px 0"><span><span class="live"></span>${x[0]}</span><span class="mono leg">${x[1]}</span></div>`).join(''))}</div></div>
<div style="margin-top:14px">${card('Recent activity',(S.log.slice(0,5).map(x=>`<div class="mono leg">${x}</div>`).join(''))||'<p class="leg">No events yet. Use Dynamic Events to simulate changing conditions.</p>')}</div>`},
resources(){return `<h1>Resource Status</h1><div class="card"><div class="chips">${['All','Available','Standby','Maintenance','Unavailable'].map(f=>`<button class="chip ${S.f==f?'on':''}" onclick="S.f='${f}';render()">${f}</button>`).join('')}<div style="flex:1;min-width:200px"><input placeholder="Search ID, type, task" value="${S.q}" oninput="S.q=this.value;$('#tb').innerHTML=rows()"></div></div><div style="overflow-x:auto"><table><tr><th>Resource ID</th><th>Type</th><th>Status</th><th>Readiness</th><th>Crew</th><th>Maintenance</th><th>Current Assignment</th><th>Last Updated</th></tr><tbody id="tb">${rows()}</tbody></table></div></div>`},
planning(){const x=S.pl;return `<h1>AI Planning &amp; Optimization</h1><div class="card"><div class="row"><button class="btn pri big" id="gb" onclick="gen()">Generate Optimal Plan</button><span class="leg">Constraint-based allocation over fused, synthetic data. Priority-weighted coverage, readiness, crew, capability and environment limits.</span></div><div id="pp" style="margin-top:12px"></div></div><div id="pr">${x?res(x):''}</div>`},
events(){const e=S.ev;return `<h1>Dynamic Event Simulator</h1><div class="card"><h3>Simulate a change in the operating environment</h3><div class="row">${[['res','Resource Unavailable'],['crew','Crew Unavailable'],['mnt','Maintenance Constraint'],['env','Environmental Constraint'],['pri','Priority Changed'],['multi','Multiple Constraints']].map(b=>`<button class="btn" onclick="trig('${b[0]}')">${b[1]}</button>`).join('')}<button class="btn" style="margin-left:auto" onclick="init();render()">Reset Simulation</button></div></div>
<div class="g2"><div id="evc">${e?evCard():'<div class="card"><p class="leg">No event active. Trigger an event to see the impact on the current plan.</p></div>'}</div>${card('Event timeline',S.log.slice(0,8).map(x=>`<div class="mono leg" style="padding:3px 0">${x}</div>`).join('')||'<p class="leg">Empty</p>')}</div>`},
whatif(){const o=(n,a)=>`<div><label class="leg">${n}</label><select id="${a[0]}">${a[1].map((v,i)=>`<option value="${i}">${v}</option>`).join('')}</select></div>`;return `<h1>What-If Simulator</h1><div class="card"><div class="g3">${o('Resource availability',['wa',['Normal','-10%','-20%']])}${o('Task demand',['wd',['Normal','+10%','+20%']])}${o('Environmental conditions',['we',['Normal','Moderate Constraint','High Constraint']])}${o('Crew availability',['wc',['Normal','Reduced']])}</div><div style="margin-top:12px"><button class="btn pri" onclick="runWI()">Run Scenario</button></div></div><div id="wr">${S.wi||''}</div>`},
analytics(){const f=S.an,n=f=='24h'?12:f=='7d'?7:10,L=[...Array(n)].map((_,i)=>f=='24h'?String(i*2).padStart(2,'0'):f=='7d'?'D'+(i+1):String(i*3+1)),r=R(f.length*13+n),g=(b,a)=>[...Array(n)].map(()=>Math.round(b+(r()-.5)*a));
return `<h1>Analytics</h1><div class="chips">${['24h','7d','30d'].map(x=>`<button class="chip ${f==x?'on':''}" onclick="S.an='${x}';render()">Last ${x}</button>`).join('')}<span class="leg">Synthetic data</span></div><div class="g3">
${card('Resource utilization (%)',ch('line',L,[{v:g(76,16)}],40,100))}${card('Readiness trend (%)',ch('line',L,[{v:g(90,8)}],60,100))}${card('Task demand (tasks)',ch('bar',L,[{v:g(16,10)}]))}
${card('Planning time (min): manual vs AI',ch('bar',['Baseline','Resource','Crew','Weather','Priority'],[{n:'Manual',c:'#7b8aa3',v:[12,9,7,8,6]},{n:'AI',v:[.05,.05,.05,.05,.05]}])+'<div class="leg">AI planning completes in under 5 seconds in each case.</div>')}
${card('Optimization improvement (score %)',ch('bar',['Baseline','Resource','Crew','Weather','Priority'],[{n:'Before',c:'#7b8aa3',v:[78,71,74,69,75]},{n:'After',v:[94,93,95,91,94]}],50,100))}
${card('Constraint frequency (events)',ch('bar',['Maint.','Crew','Weather','Priority','Airspace'],[{v:[9,6,7,5,3].map(v=>v+(r()*3|0))}]))}${card('Resource availability (count)',ch('line',L,[{v:g(34,8)}],20,42))}</div>`},
recs(){return `<h1>AI Recommendations</h1>${S.recs.length?S.recs.map(recCard).join(''):'<div class="card"><p>No recommendations yet. <a href="#planning">Generate a plan</a> or <a href="#events">simulate an event</a>.</p></div>'}`},
arch(){const N=[['Data Sources','Resource, crew, maintenance, weather and task priority systems'],['Data Ingestion','Streams normalised to a common schema'],['Data Validation','Range, freshness and consistency checks'],['Multi-Source Data Fusion','Entity resolution across systems'],['Common Operational Picture','One shared, real-time view for planners'],['Predictive Analytics','Availability, readiness, maintenance and demand forecasts'],['Optimization Engine','Constraint-based assignment and re-planning'],['AI Recommendation','Ranked plan with score, confidence and explanation'],['Human Review &amp; Approval','Planner approves, rejects or modifies. No autonomous execution.']];
return `<h1>AI / Data Architecture</h1><div class="flow">${N.map((n,i)=>(i?'<div class="arw"></div>':'')+`<div class="node ${i==8?'hl':''}"><b>${n[0]}</b><small>${n[1]}</small></div>`).join('')}</div>`}};
function rows(){const q=S.q.toLowerCase();return S.res.filter(r=>(S.f=='All'||r.status==S.f)&&(r.id+r.type+(S.tasks.find(t=>S.plan[t.id]==r.id)||{id:''}).id).toLowerCase().includes(q)).map(r=>{const t=S.tasks.find(t=>S.plan[t.id]==r.id);return `<tr><td class="m">${r.id}</td><td>${r.type}</td><td>${bd(r.status)}</td><td class="m">${eff(r)}%</td><td class="m">${r.crew}</td><td>${r.maint}</td><td>${t?t.id+' '+t.name:'-'}</td><td class="m">${r.upd}</td></tr>`}).join('')||'<tr><td colspan=8 class="leg">No resources match the filter.</td></tr>'}
function res(x){const{b,a,rec}=x;return `<div class="g3" style="margin-top:14px">${cmp('Plan score',b.score+'%',a.score+'%')}${cmp('Resource conflicts',b.conf+b.un,a.conf+a.un)}${cmp('Unused capacity',100-b.util+'%',100-a.util+'%')}${cmp('Planning time','12 min','3 sec')}</div>
<div class="g3" style="margin-top:14px">${card('Improvement',ch('bar',['Score','Utilization','Coverage'],[{n:'Current',c:'#7b8aa3',v:[b.score,b.util,Math.round(b.cov*100)]},{n:'Optimized',v:[a.score,a.util,Math.round(a.cov*100)]}],0,100))}</div>${recCard(rec)}`}
async function gen(){$('#gb').disabled=true;await proc('#pp',['Collecting current data','Validating constraints','Analysing resource availability','Running optimization','Generating recommendations','Plan generated']);
const np=opt(),b=ev(S.plan),a=ev(np),rec=mkRec(np,b,a);S.recs.unshift(rec);S.pl={b,a,rec};S.log.unshift(`${clock()} ${rec.id} generated, score ${b.score}% to ${a.score}%`);render()}
function evCard(){const e=S.ev,x=ev(S.plan),need=x.bad.length||(e.rec&&e.rec.st=='Pending'),r=e.rec;
let h=`<div class="ev ${need?'':'ok'}"><b class="${need?'wn':'ok'}">${r&&r.st[0]=='A'?'PLAN UPDATED':'EVENT DETECTED'}</b><p>${e.msgs.join('<br>')}</p><div class="row" style="gap:24px"><div><span class="leg">Affected tasks</span><br><b class="mono">${e.aff.length}</b></div><div><span class="leg">Current plan status</span><br><b class="${x.bad.length?'wn':'ok'}">${x.bad.length?'REQUIRES RE-OPTIMIZATION':'WITHIN LIMITS'}</b></div></div>
${!r?`<div style="margin-top:12px"><button class="btn pri" id="rb" onclick="reopt()">Run Re-Optimization</button></div><div id="ep" style="margin-top:10px"></div>`:''}</div>`;
if(r){const af=Math.max(e.aff.length,r.n),mt=6+af*2,at=2+Math.round(af*.3),B=r.b,A=r.a;h+=`<div class="ev ok"><b class="ok">NEW PLAN GENERATED</b><div class="row" style="gap:24px;margin-top:6px"><div><span class="leg">Affected assignments</span><br><b class="mono">${r.n}</b></div><div><span class="leg">Resolved conflicts</span><br><b class="mono">${B.conf+B.un-A.conf-A.un}</b></div><div><span class="leg">New plan score</span><br><b class="mono">${A.score}%</b></div></div></div>
<div class="card" style="margin-top:14px"><h3>Before / after</h3><table><tr><th>Metric</th><th>Before</th><th>After</th></tr>${[['Planning Time',mt+' min',at+' sec'],['Resource Conflicts',B.conf,A.conf],['Utilization',B.util+'%',A.util+'%'],['Unassigned Tasks',B.un,A.un],['Plan Score',B.score+'%',A.score+'%']].map(m=>`<tr><td>${m[0]}</td><td class="m">${m[1]}</td><td class="m ok">${m[2]}</td></tr>`).join('')}</table></div>${recCard(r)}`}return h}
async function reopt(){$('#rb').disabled=true;await proc('#ep',['Detecting impact...','Recalculating constraints...','Evaluating alternatives...','Generating new feasible plan...'],550);const np=opt(),b=ev(S.plan),a=ev(np),r=mkRec(np,b,a);S.recs.unshift(r);S.ev.rec=r;S.log.unshift(`${clock()} ${r.id} generated after event, score ${b.score}% to ${a.score}%`);render()}
function trig(k){const A=()=>S.res.filter(r=>usable(r)&&Object.values(S.plan).includes(r.id)),m=[],ch2=[];let chg=[];
const f={res(){const l=A(),r=l.find(x=>x.id=='R-007')||l[0];if(!r)return;r.status='Unavailable';r.ready=0;r.crew=0;r.upd=clock();m.push(`Resource ${r.id} (${r.type}) is no longer available.`);S.chg.push(`Resource ${r.id} became unavailable.`)},
crew(){const l=A(),r=l[Math.min(2,l.length-1)];if(!r)return;r.crew=0;r.upd=clock();m.push(`Crew for ${r.id} is unavailable (duty-time limit reached).`);S.chg.push(`Crew for ${r.id} became unavailable.`)},
mnt(){const l=A(),r=l[Math.min(4,l.length-1)];if(!r)return;r.status='Maintenance';r.ready=40;r.maint='Unscheduled fault';r.upd=clock();m.push(`Maintenance constraint on ${r.id}: unscheduled fault reported.`);S.chg.push(`A maintenance constraint affected ${r.id}.`)},
env(){S.env.lv=Math.min(2,S.env.lv+1);m.push(`Environmental constraint raised to ${S.env.lv>1?'HIGH':'MODERATE'} in Sector C. Rotary and Lift-B availability reduced.`);S.chg.push(`Current environmental conditions changed (${S.env.lv>1?'high':'moderate'} constraint).`)},
pri(){const t=S.tasks.find(t=>t.pr==1);if(!t)return;t.pr=3;ch2.push(t.id);m.push(`Priority of ${t.id} (${t.name}) raised to High.`);S.chg.push(`Task priority changed: ${t.id} is now High.`)}};
if(k=='multi'){f.res();f.crew();f.env();f.pri()}else f[k]();S.log.unshift(`${clock()} ${m.join(' ')}`);const x=ev(S.plan);S.ev={msgs:m,aff:[...new Set([...x.bad,...ch2])],rec:null};render()}
function runWI(){const a=+$('#wa').value,d=+$('#wd').value,e=+$('#we').value,c=+$('#wc').value,R0=S.res,E0=S.env;let o;try{const base=ev(opt());S.res=JSON.parse(JSON.stringify(R0));S.env={lv:e};
if(a){S.res.filter(usable).filter((_,i)=>i%(a==1?10:5)==0).forEach(r=>{r.status='Unavailable';r.ready=0})}if(c)S.res.filter(usable).forEach((r,i)=>{if(i%3==0)r.crew=0});
const T=[...S.tasks,...S.tasks.slice(0,Math.ceil(18*d*.1)).map((t,i)=>({...t,id:'T-X'+i}))],p=opt(T),r=ev(p,T),un=T.filter(t=>!p[t.id]),hi=un.filter(t=>t.pr==3).length;
const feas=!un.length?'Feasible':hi?'Infeasible without changes':'Feasible with deferrals',eff2=2+un.length+(a+d+e+c);
o=`<div class="g3" style="margin-top:14px">${[['Feasibility',`<span class="${!un.length?'ok':hi?'bd':'wn'}">${feas}</span>`],['Resource utilization',r.util+'%'],['Conflicts',r.conf],['Plan score',r.score+'%'],['Estimated planning effort',eff2+' sec automated vs ~'+(10+un.length*3+(a+d+e+c)*2)+' min manual'],['Unassigned tasks',un.length]].map(x=>`<div class="cmp"><span>${x[0]}</span><div style="font-size:16px">${x[1]}</div></div>`).join('')}</div>
<div class="g3" style="margin-top:14px">${card('Baseline vs scenario',ch('bar',['Score','Utilization','Coverage'],[{n:'Baseline',c:'#7b8aa3',v:[base.score,base.util,Math.round(base.cov*100)]},{n:'Scenario',v:[r.score,r.util,Math.round(r.cov*100)]}],0,100))}${card('Recommended adjustment',`<p>${!un.length?'No adjustment required. Proceed with the optimized allocation.':hi?`Return standby or maintenance resources to service, or request additional capacity for: ${un.filter(t=>t.pr==3).map(t=>t.type).filter((v,i,s)=>s.indexOf(v)==i).join(', ')}.`:`Defer ${un.length} low or medium priority task(s): ${un.map(t=>t.id).join(', ')}.`}</p>`)}</div>`}finally{S.res=R0;S.env=E0}S.wi=o;render();[['wa',a],['wd',d],['we',e],['wc',c]].forEach(x=>$('#'+x[0]).value=x[1])}
function login(){return `<div class="login"><form class="card" onsubmit="event.preventDefault();S.user={id:$('#u').value||'planner01',role:$('#ro').value};location.hash='#dashboard';render()"><h1 style="margin-bottom:2px">Air Power Decision Support</h1><div class="leg">SIH26250 | Dynamic Air Operations &amp; Resource Optimisation</div>
<label>User ID</label><input id="u" value="planner01"><label>Password</label><input id="pw" type="password" value="demo1234"><label>Role</label><select id="ro"><option>Operations Planner</option><option>Resource Manager</option><option>Administrator</option></select>
<button class="btn pri" style="width:100%;margin-top:18px">Sign In</button><p class="leg">Prototype access is simulated. All data is synthetic. This system provides decision support only and does not control any asset.</p></form></div>`}
function render(){if(!S.user){$('#app').innerHTML=login();return}const v=(location.hash||'#dashboard').slice(1),k=P[v]?v:'dashboard',N=[['dashboard','Dashboard'],['resources','Resources'],['planning','Planning'],['events','Dynamic Events'],['whatif','What-If'],['analytics','Analytics'],['recs','AI Recommendations'],['arch','Architecture']];
$('#app').innerHTML=`<header class="top"><div class="brand">Air Power DSS<small>SIH26250</small></div><nav class="nav">${N.map(n=>`<a href="#${n[0]}" class="${n[0]==k?'on':''}">${n[1]}</a>`).join('')}</nav><div class="rt"><span class="live">LIVE</span><span class="mono" id="clk">04 Oct 2026 ${clock()} SIM</span><span class="h">${S.user.id} | ${S.user.role}</span><a href="#" onclick="S.user=null;init();render()">Sign out</a></div></header><main>${P[k]()}</main><footer>Decision-support prototype. Synthetic data and fictional identifiers only. No autonomous control; every plan change requires human approval.</footer>`}
addEventListener('hashchange',()=>S.user&&render());init();render();
setInterval(()=>{if(!S.user)return;S.min+=5;S.tick=(S.tick||0)+1;S.res.filter(usable).slice(S.tick%8).filter((_,i)=>i%9==0).forEach(r=>{r.ready=Math.max(62,Math.min(99,r.ready+(S.tick%2?1:-1)))});
const c=$('#clk');if(c)c.textContent='04 Oct 2026 '+clock()+' SIM';if(S.tick%3==0){toast(ev(S.plan).bad.length&&!S.recs.some(r=>r.st=='Pending')?'Re-optimization recommended':'Operational state updated');if(location.hash.slice(1)=='dashboard'||!location.hash)render()}},8000);
</script></body></html>
